[build-system]
requires = ["setuptools >= 59.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SynaptogenML"
version = "2025.05"
description="A library based on Synaptogen and PyTorch enabling the simulation of memristor hardware for machine learning"
dependencies = [
    "numpy",
    "torch",
    "pytest"
]
requires-python = ">= 3.8"
authors = [
    {name = "Nick Rossenbach"},
    {name = "Benedikt Hilmes"},
    {name = "Moritz Gunz"},
]

[project.optional-dependencies]
examples = [
    "torchvision",
    "jupyter"
]
tests = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["synaptogen_ml"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
markers = [
  "fidelity: Per-layer programming fidelity, memristor output vs quantized reference",
  "end_to_end: Train a small QAT model, program it, check memristor accuracy",
  "fast: Tests for the opt-in fast inference path",
  "programming: Tests for the cell programming helpers and the opt-in parallel programming path",
  "readout: Tests for the selectable readout-noise models (legacy / physical / off)",
]
